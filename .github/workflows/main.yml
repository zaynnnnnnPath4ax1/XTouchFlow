name: Build TouchFlow APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: List files (debug)
        run: ls -la

      - name: Unzip project (auto-detect zip name)
        run: |
          ZIPFILE=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)
          echo "Found zip: $ZIPFILE"
          if [ -z "$ZIPFILE" ]; then
            echo "No zip file found in repo root!"
            exit 1
          fi
          unzip -o "$ZIPFILE" -d extracted
          cp -r extracted/* .
          ls -la

      - name: Fix BluetoothBridge.kt bug
        run: |
          FILE="app/src/main/java/com/touchflow/app/BluetoothBridge.kt"
          sed -i 's/activity.getSystemService(MainActivity.BLUETOOTH_SERVICE) as? BluetoothManager/activity.getSystemService(BluetoothManager::class.java) as? BluetoothManager/' "$FILE"
          sed -i 's/activity.getSystemService(BluetoothManager::class.java) as? BluetoothManager)?.adapter/activity.getSystemService(BluetoothManager::class.java)?.adapter/' "$FILE"
          grep -n "getSystemService" "$FILE"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TouchFlow-debug-apk
          path: app/build/outputs/apk/debug/*.apk
